[package]
name = "buzzr"
version = "0.2.0-rc.2"
edition = "2021"
rust-version = "1.88"
description = "A terminal client for Buzz that talks to the relay directly"
license = "MIT"
repository = "https://github.com/buzzzr/buzzr"

[dependencies]
# Buzz's own crates: event builders (buzz-sdk), event kinds and helpers (buzz-core), WebSocket auth and message parsing
# (buzz-ws-client). Pinned to a known-good commit of the Buzz repository.
buzz-core = { git = "https://github.com/block/buzz", rev = "24a370606044c0c7be787cc2fd98ec0bfe1d606b" }
buzz-sdk = { git = "https://github.com/block/buzz", rev = "24a370606044c0c7be787cc2fd98ec0bfe1d606b" }
buzz-ws-client = { git = "https://github.com/block/buzz", rev = "24a370606044c0c7be787cc2fd98ec0bfe1d606b" }
nostr = { version = "0.44", features = ["nip44", "nip98"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
ratatui = "0.30.2"
pulldown-cmark = "0.13.6"
unicode-width = "0.2.3"
scrypt = "0.12.0"
aes-gcm = "0.11.1"
rpassword = "7.5.4"
zeroize = "1.9.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
iana-time-zone = "0.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream", "bracketed-paste"] }
anyhow = "1"

[dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }
vt100 = "0.18.1"
